[package]
name = "sidecar"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deepin-ports-installer-helper"
path = "src/main.rs"

[dependencies]
android-sparse-image = "0.2"
fastboot-protocol = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
gptman = { version = "3", default-features = false }
rockusb = { version = "0.4", features = ["nusb"] }
shared = { path = "../shared", default-features = false }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
uuid = "1"
