[package]
name = "sidecar"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deepin-ports-installer-helper"
path = "src/main.rs"

[dependencies]
sidecar-protocol = { path = "../sidecar-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
