[package]
name = "base"
version.workspace = true
edition.workspace = true

[features]
# Derive `clap::ValueEnum` for shared value types such as `Arch`.
cli = ["dep:clap"]
# Shared HTTP client helpers.
http = ["dep:reqwest", "dep:rustls"]
# Crawl the image repository to regenerate the `images.toml` manifest.
generate = ["http", "dep:astral-html", "dep:futures-util"]
# Privileged helper sidecar: loopback WebSocket protocol and elevation.
privileged = [
    "dep:futures-util",
    "dep:libc",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tungstenite",
]

[dependencies]
astral-html = { version = "0.0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
libc = { version = "0.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["charset", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
toml = { version = "1", features = ["preserve_order"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
url = "2"
