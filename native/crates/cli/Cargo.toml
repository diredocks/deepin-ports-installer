[package]
name = "cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deepin-ports-installer-cli"
path = "src/main.rs"

[dependencies]
catalog = { path = "../catalog", features = ["cli"] }
fetch = { path = "../fetch" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = { version = "8", features = ["tty"] }
flash = { path = "../flash" }
env_logger = "0.11"
humansize = "2"
indicatif = "0.18"
log = "0.4"
drives = { path = "../drives" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
