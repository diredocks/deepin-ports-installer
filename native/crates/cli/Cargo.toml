[package]
name = "cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deepin-ports-installer-cli"
path = "src/main.rs"

[dependencies]
base = { path = "../base", features = ["cli", "generate"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = { version = "8", features = ["tty"] }
env_logger = "0.11"
humansize = "2"
indicatif = "0.18"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
