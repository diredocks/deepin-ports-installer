[package]
name = "installer-core"
version.workspace = true
edition.workspace = true

[features]
# Derive `clap::ValueEnum` for shared value types such as `Arch`.
cli = ["dep:clap"]
# Shared HTTP client helpers.
http = ["dep:reqwest", "dep:rustls"]
# Crawl the image repository to regenerate the `images.toml` manifest.
generate = ["http", "dep:astral-html", "dep:futures-util"]

[dependencies]
astral-html = { version = "0.0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["charset", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }
url = "2"
