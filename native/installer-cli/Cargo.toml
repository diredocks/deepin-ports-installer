[package]
name = "installer-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deepin-ports-installer-cli"
path = "src/main.rs"

[dependencies]
installer-core = { path = "../installer-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
