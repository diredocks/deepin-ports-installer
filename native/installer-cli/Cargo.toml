[package]
name = "installer-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deepin-ports-installer-cli"
path = "src/main.rs"

[dependencies]
installer-core = { path = "../installer-core", features = ["cli"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
env_logger = "0.11"
humansize = "2"
log = "0.4"
